<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ABASTECE JÁ - Portal do Promotor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0f1d">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0f1d 0%, #162032 50%, #0a0f1d 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 24px 20px;
            box-sizing: border-box;
        }

        .auth-card {
            background: rgba(22, 32, 50, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .auth-logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin: 0 0 4px 0;
            color: #ffffff;
        }

        .auth-logo span {
            color: #f59e0b;
        }

        .auth-subtitle {
            font-size: 12px;
            font-weight: 700;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .input-field:focus {
            border-color: #f59e0b;
            background: rgba(255, 255, 255, 0.08);
        }

        .input-field::placeholder {
            color: #64748b;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            text-align: left;
        }

        .checkbox-group input {
            accent-color: #f59e0b;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 11px;
            color: #cbd5e1;
            cursor: pointer;
        }

        .btn-auth-primary {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(217, 119, 6, 0.3);
            margin-top: 8px;
            transition: transform 0.2s ease;
        }

        .btn-auth-primary:active {
            transform: scale(0.98);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #64748b;
            font-size: 11px;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 10px;
        }

        .btn-auth-google {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-weight: 600;
            font-size: 13px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s ease;
        }

        .btn-auth-google:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-auth-link {
            display: inline-block;
            color: #94a3b8;
            font-size: 12px;
            text-decoration: none;
            margin-top: 22px;
            transition: color 0.2s ease;
        }

        .btn-auth-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="auth-logo">ABASTECE<span>JÁ</span></h1>
            <p class="auth-subtitle">Portal do Promotor & Freelancer</p>

            <form onsubmit="return false;">
                <div class="form-group">
                    <input type="text" class="input-field" placeholder="Seu Nome Profissional">
                </div>
                <div class="form-group">
                    <input type="text" class="input-field" placeholder="CPF (Apenas números)">
                </div>
                <div class="form-group">
                    <input type="text" class="input-field" placeholder="MEI / Registro ou Experiência (Opcional)">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Lembre-se de mim neste dispositivo</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="accept-terms">
                    <label for="accept-terms">Li e concordo com os <a href="#" style="color: #f59e0b;">Termos e Taxas da Plataforma</a></label>
                </div>

                <button type="submit" class="btn-auth-primary">Validar e Entrar</button>
            </form>

            <div class="divider">
                <span>ou</span>
            </div>

            <button class="btn-auth-google">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#ffffff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#ffffff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                </svg>
                Entrar com Google
            </button>

            <a href="index.html" class="btn-auth-link">
                ← Voltar para o App do Contratante
            </a>
        </div>
    </div>

</body>
</html>
