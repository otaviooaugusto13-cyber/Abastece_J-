<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ABASTECE JÁ - Painel do Contratante</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0f1d">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f1d 0%, #162032 50%, #0a0f1d 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-card {
            background: rgba(22, 32, 50, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .auth-logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
            color: #ffffff;
        }

        .auth-logo span {
            color: #f59e0b;
        }

        .auth-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 28px;
            font-weight: 500;
        }

        .terms-box {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            padding: 12px 14px;
            text-align: left;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .terms-box input[type="checkbox"] {
            accent-color: #f59e0b;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .terms-box label {
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.4;
            cursor: pointer;
        }

        .terms-box a {
            color: #f59e0b;
            text-decoration: underline;
            font-weight: 700;
        }

        .btn-auth-primary {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(217, 119, 6, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn-auth-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-auth-primary:not(:disabled):active {
            transform: scale(0.98);
        }

        .btn-auth-secondary {
            display: block;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: #f59e0b;
            font-weight: 700;
            font-size: 13px;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            text-decoration: none;
            text-align: center;
            margin-top: 12px;
            box-sizing: border-box;
            transition: background 0.2s ease;
        }

        .btn-auth-secondary:hover {
            background: rgba(245, 158, 11, 0.1);
        }

        .btn-auth-link {
            display: inline-block;
            color: #94a3b8;
            font-size: 12px;
            text-decoration: none;
            margin-top: 20px;
            transition: color 0.2s ease;
        }

        .btn-auth-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="auth-logo">ABASTECE<span>JÁ</span></h1>
            <p class="auth-subtitle">Painel do Contratante • Varejo</p>

            <div class="terms-box">
                <input type="checkbox" id="check-termos-aluno">
                <label for="check-termos-aluno">
                    Li e concordo com os <a href="#" onclick="abrirModalTermosAluno(); return false;">Termos de Uso da Plataforma</a>.
                </label>
            </div>

            <button id="btn-login-aluno" class="btn-auth-primary" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#ffffff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#ffffff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                </svg>
                Entrar com Google (Contratante)
            </button>

            <a href="promotor.html" class="btn-auth-secondary">
                Sou Freelancer / Promotor
            </a>

            <a href="landing.html" class="btn-auth-link">
                ← Voltar para Página de Apresentação
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkTermos = document.getElementById('check-termos-aluno');
            const btnLogin = document.getElementById('btn-login-aluno');

            if (checkTermos && btnLogin) {
                checkTermos.addEventListener('change', () => {
                    btnLogin.disabled = !checkTermos.checked;
                });
            }
        });
    </script>
</body>
</html>
